name: CD Deploy to VPS

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}

          script: |
            cd /var/www/m-motors/m-motors-back

            git pull origin main

            docker compose down
            docker compose up -d --build

            # ======================
            # MIGRATION ALEMBIC
            # ======================
            docker exec m-motors-back alembic upgrade head

            # ======================
            # SEED INITIAL DATA
            # ======================
            docker exec m-motors-back python scripts/create_admin.py